<app-page-header></app-page-header>
<div class="row">
  <div class="col-sm-12">
   
    <!-- Table Section -->
    <mat-card>
      <mat-card-content>
        <div class="table-container">
          <div class="table-header-toolbar">
            <div class="row">
              <div class="col-sm-8">
                <span class="table-header">All Property Subtypes</span>
                <mat-form-field appearance="outline" class="search-box">
                  <mat-label class="search-label">Search...</mat-label>
                  <input #filter (keyup)="applyFilter($event)" matInput type="text" />
                  <mat-icon matSuffix>search</mat-icon>
                </mat-form-field>
              </div>
              <div class="col-sm-4">
                <div class="right-side-btn">
                  <button mat-icon-button (click)="addNew()" class="tbl-header-btn text-green" matTooltip="Add">
                    <mat-icon>add_circle_outline</mat-icon>
                  </button>
                 
                </div>
              </div>
            </div>
          </div>
          <br />

          <!-- Responsive Table -->
          <div class="overflow-auto">
            <div class="responsive_table">
              <table mat-table [dataSource]="dataSource" matSort class="mat-cell advance-table">
                <!-- Property Type Column -->
                <ng-container matColumnDef="propertyType">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Property Type</mat-header-cell>
                  <mat-cell *matCellDef="let row">{{ row.propertyType.ptname }}</mat-cell>
                </ng-container>

                <!-- Property Subtype Name Column -->
                <ng-container matColumnDef="pstname">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Property Subtype Name</mat-header-cell>
                  <mat-cell *matCellDef="let row">{{ row.pstname }}</mat-cell>
                </ng-container>

                <!-- Status Column -->
                <ng-container matColumnDef="status">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Status</mat-header-cell>
                  <mat-cell *matCellDef="let row">{{ row.status }}</mat-cell>
                </ng-container>

                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                  <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
                  <mat-cell *matCellDef="let row">
                    <button mat-icon-button color="accent" (click)="editCall(row)" class="tbl-action-btn">
                      <app-feather-icons [icon]="'edit'" [class]="'tbl-fav-edit'"></app-feather-icons>
                    </button>
                    <button mat-icon-button color="accent" (click)="deleteItem(row)" class="tbl-action-btn">
                      <app-feather-icons [icon]="'trash-2'" [class]="'tbl-fav-delete'"></app-feather-icons>
                    </button>
                  </mat-cell>
                </ng-container>

                <!-- Table Header and Rows -->
                <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
              </table>
            </div>
          </div>

          <!-- Paginator -->
          <mat-paginator #paginator [length]="dataSource.data.length" [pageIndex]="0" [pageSize]="10"
            [pageSizeOptions]="[5, 10, 25, 100]" (page)="pageEvent($event)">
          </mat-paginator>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
