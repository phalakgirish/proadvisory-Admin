<div class="file-drop-area" (drop)="onDrop($event)" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)">
  <button mat-raised-button color="primary" (click)="triggerFileInput()">Choose file</button>
  <span>{{ file ? file.name : ' or drag and drop file here' }}</span>
  <input
    #fileInput
    class="file-input"
    type="file"
    (change)="emitFiles($event)"
    accept="image/*"
  />
</div>
